# 인트라넷 경로별 전달 규칙 (docker-compose.prod.yaml의 nginx 서비스가 읽는다)
# 개발 환경에서 frontend/next.config.ts의 redirects·rewrites가 하던 일을 운영에서는 여기서 한다.
# 브라우저에는 같은 출처의 /api로 보이므로 프론트 코드·refresh 쿠키(Path=/api/auth)는 그대로다.
#
#   /api/socket.io  → intranet-backend:3100/socket.io/  (채팅 소켓, WebSocket)
#   /api, /api/     → 302 /api/docs                       (API 문서)
#   /api/...        → intranet-backend:3100/...           (/api를 떼고 전달)
#   나머지          → intranet-frontend:3000
#
# 지금은 HTTP(80)만. 서버 단계에서 추가: server_name(도메인), 443 + 인증서, HTTP → HTTPS 이동,
# 루트 도메인 → Notion 301, /api/docs Basic 인증 (docs/design/need_list.md 2장)

server {
    listen 80;
    server_name _;

    # 이동(return 302 등) 주소를 경로만 보낸다. 켜 두면(기본값) nginx가 자기 listen 포트로 완전한 주소를 만들어
    # 바깥 포트가 다를 때(로컬 8080 → 컨테이너 80) http://localhost/api/docs 처럼 틀린 곳으로 보낸다. (2026-11-25)
    absolute_redirect off;

    # 업로드 한도. nginx 기본값은 1MB라 넘으면 413. 백엔드 한도(첨부 200MB, 채팅 이미지 묶음 200MB)에 맞춘다
    client_max_body_size 200m;

    # 채팅 소켓 (Socket.IO). 클라이언트는 끝 슬래시 없이 /api/socket.io?EIO=4... 로 요청한다(services/chat-socket.ts).
    # 서버 주소는 끝 슬래시가 있어야 해서(/socket.io/) 여기서 붙인다. 쿼리는 nginx가 그대로 붙여 넘긴다.
    location = /api/socket.io {
        proxy_pass http://intranet-backend:3100/socket.io/;
        # HTTP 연결을 WebSocket으로 바꾸는 요청(Upgrade)을 백엔드까지 전달한다. 없으면 연결이 바로 끊긴다
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # location 안에서 proxy_set_header를 하나라도 쓰면 바깥 값이 상속되지 않아 아래 헤더를 다시 적는다
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 정확히 /api 만 API 문서로 (next.config.ts의 redirects와 같은 규칙)
    location = /api {
        return 302 /api/docs;
    }
    location = /api/ {
        return 302 /api/docs;
    }

    # API. proxy_pass 끝의 / 때문에 앞의 /api/ 가 떨어진다: /api/auth/login/emp → /auth/login/emp
    location /api/ {
        proxy_pass http://intranet-backend:3100/;
        # 실제 사용자 IP·프로토콜을 넘긴다. 백엔드가 이 값을 믿으려면 trust proxy 설정이 필요하다(배포 전 별도 작업)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 화면
    location / {
        proxy_pass http://intranet-frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
